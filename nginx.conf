events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Upstream services in reactory-network
    upstream backend_api {
        server reactory-express-server:4000;
    }

    upstream reactory_client {
        server reactory-pwa-client:80;
    }

    upstream booktutor_client {
        server booktutor-pwa-client:80;
    }

    # 1. API Server (api.reactory.local)
    server {
        listen 80;
        server_name api.reactory.local api.reactory.dev;

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # 2. BookTutor Client (booktutor.reactory.local)
    server {
        listen 80;
        server_name booktutor.reactory.local booktutor.reactory.dev;

        location / {
            proxy_pass http://booktutor_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Reactory Management Client (reactory.local, www.reactory.local, app.reactory.local, default)
    server {
        listen 80 default_server;
        server_name reactory.local www.reactory.local app.reactory.local reactory.dev www.reactory.dev app.reactory.dev _;

        location / {
            proxy_pass http://reactory_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
