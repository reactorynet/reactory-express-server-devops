apiVersion: v2
name: reactory-secrets
description: |
  ClusterSecretStore and ExternalSecret resources that project Reactory's
  AWS Secrets Manager secrets into Kubernetes Secrets.

  Shipped as a local Helm chart rather than kubernetes_manifest resources
  because kubernetes_manifest requires a reachable API server and the CRD
  to already be registered at *plan* time. On a green-field apply the EKS
  cluster does not exist yet, so plan fails. helm_release defers all of
  that to apply time.
type: application
version: 1.0.0
appVersion: "1.0.0"
