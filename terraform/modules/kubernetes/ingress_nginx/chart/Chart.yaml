apiVersion: v2
name: letsencrypt-issuer
description: |
  A cert-manager ClusterIssuer for Let's Encrypt, solving HTTP-01 challenges
  through ingress-nginx.

  Shipped as a local Helm chart rather than a kubernetes_manifest resource
  because kubernetes_manifest requires the CRD to be registered at *plan* time.
  On a green-field apply cert-manager has not been installed yet, so planning
  fails. helm_release defers everything to apply.
type: application
version: 1.0.0
appVersion: "1.0.0"
