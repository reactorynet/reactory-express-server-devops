events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;
    resolver 10.89.0.1 valid=5s ipv6=off;

    # 1. API Server (api.reactory.local)
    server {
        listen 80;
        server_name api.reactory.local api.reactory.dev;

        location / {
            set $backend "http://reactory-express-server:4000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # 2. BookTutor Client (booktutor.reactory.local)
    server {
        listen 80;
        server_name booktutor.reactory.local booktutor.reactory.dev;

        location / {
            set $booktutor_client "http://booktutor-pwa-client:80";
            proxy_pass $booktutor_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Reactory Management Client (reactory.local, www.reactory.local, app.reactory.local, default)
    server {
        listen 80 default_server;
        server_name reactory.local www.reactory.local app.reactory.local reactory.dev www.reactory.dev app.reactory.dev _;

        location / {
            set $reactory_client "http://reactory-pwa-client:80";
            proxy_pass $reactory_client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
